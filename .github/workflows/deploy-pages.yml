name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /vinte-memorias-vitoria
      NEXT_PUBLIC_SITE_URL: https://1victorx.github.io/vinte-memorias-vitoria/
      NEXT_PUBLIC_FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar o código
        run: npm run lint

      - name: Gerar o site estático
        run: npm run build:pages

      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
